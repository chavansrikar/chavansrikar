<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" role="img" aria-label="Engineering loop: frame, decompose, build, validate, ship">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B93FF"/><stop offset="50%" stop-color="#36D1DC"/><stop offset="100%" stop-color="#8B93FF"/>
    </linearGradient>
  </defs>
  <line x1="25" y1="38" x2="335" y2="38" stroke="#2B3350" stroke-width="3"/>
  <line x1="25" y1="38" x2="335" y2="38" stroke="url(#line)" stroke-width="3" stroke-dasharray="6 12" opacity="0.65"/>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#8B93FF" stroke="#8B93FF"><circle cx="25" cy="38" r="5"/><circle cx="100" cy="38" r="5"/><circle cx="180" cy="38" r="5"/><circle cx="260" cy="38" r="5"/><circle cx="335" cy="38" r="5"/></g>
    <g fill="#F5F7FF" font-size="9" font-weight="600" letter-spacing="1"><text x="25" y="66">FRAME</text><text x="100" y="66">DECOMPOSE</text><text x="180" y="66">BUILD</text><text x="260" y="66">VALIDATE</text><text x="335" y="66">SHIP</text></g>
    <text x="180" y="89" font-size="9" fill="#8B93FF">An unfamiliar problem is just a system waiting to be understood.</text>
  </g>
  <g transform="translate(25,38)">
    <circle r="5" fill="#36D1DC">
      <animateMotion path="M 0 0 L 310 0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
