<svg xmlns="http://www.w3.org/2000/svg" width="920" height="112" viewBox="0 0 920 112" role="img" aria-label="Engineering loop: frame, decompose, build, validate, ship">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B93FF"/><stop offset="50%" stop-color="#36D1DC"/><stop offset="100%" stop-color="#8B93FF"/>
    </linearGradient>
  </defs>
  <line x1="70" y1="45" x2="850" y2="45" stroke="#2B3350" stroke-width="3"/>
  <line x1="70" y1="45" x2="850" y2="45" stroke="url(#line)" stroke-width="3" stroke-dasharray="6 12" opacity="0.65"/>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#8B93FF" stroke="#8B93FF"><circle cx="70" cy="45" r="7"/><circle cx="265" cy="45" r="7"/><circle cx="460" cy="45" r="7"/><circle cx="655" cy="45" r="7"/><circle cx="850" cy="45" r="7"/></g>
    <g fill="#F5F7FF" font-size="12" font-weight="600" letter-spacing="1"><text x="70" y="76">FRAME</text><text x="265" y="76">DECOMPOSE</text><text x="460" y="76">BUILD</text><text x="655" y="76">VALIDATE</text><text x="850" y="76">SHIP</text></g>
    <text x="460" y="103" font-size="11" fill="#8B93FF">An unfamiliar problem is just a system waiting to be understood.</text>
  </g>
  <g transform="translate(70,45)">
    <circle r="7" fill="#36D1DC">
      <animateMotion path="M 0 0 L 780 0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
