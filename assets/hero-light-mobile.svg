<svg xmlns="http://www.w3.org/2000/svg" width="360" height="78" viewBox="0 0 360 78" role="img" aria-label="Professional software engineer and AI systems builder solving real-world problems">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5EF5"/><stop offset="50%" stop-color="#0E9AA7"/><stop offset="100%" stop-color="#6D5EF5"/>
    </linearGradient>
  </defs>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2937">
    <text x="180" y="34" opacity="1">Software Engineer
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.005;0.025;0.225;0.245;1" values="1;1;0;0;0;1"/>
    </text>
    <text x="180" y="34" opacity="0">AI Systems Builder
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.255;0.275;0.475;0.495;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="180" y="34" opacity="0">Real-World Problem Solver
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.505;0.525;0.725;0.745;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="180" y="34" opacity="0">NASA Space Apps 2026 Winner
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.755;0.775;0.975;0.995;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
  <rect x="171" y="48" width="18" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="x" values="171;105;171" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="18;150;18" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="180" y="68" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1" fill="#5B4FE0">FRAME · DECOMPOSE · BUILD · VALIDATE · SHIP</text>
</svg>
